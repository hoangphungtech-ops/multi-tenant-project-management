spring:
  application:
    name: tv3-export-worker
  profiles:
    default: worker
  main:
    web-application-type: none

management:
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      enabled: true
      show-details: never

logging:
  structured:
    format:
      console: logstash
  level:
    com.azure: WARN
    org.postgresql: WARN
