services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tv3demo
      POSTGRES_USER: tv3demo
      POSTGRES_PASSWORD: ${TV3_DEMO_DB_PASSWORD:?set TV3_DEMO_DB_PASSWORD}
    ports:
      - "127.0.0.1:${TV3_DEMO_DB_PORT:-55432}:5432"
    mem_limit: 512m
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tv3demo -d tv3demo"]
      interval: 2s
      timeout: 3s
      retries: 30
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
    mem_limit: 256m
    volumes:
      - azurite:/data
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([10000,10001].map(port=>fetch('http://127.0.0.1:'+port))).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres:
  azurite:
