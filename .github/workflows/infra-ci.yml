name: "CI — Full Stack Verification (TV1 Infra, TV2 API, TV3 Worker, TV4 UI & Security QA)"

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validate:
    name: "TV1 — Validate Azure Terraform (infra/)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Check Terraform formatting (terraform fmt)
        run: terraform fmt -check -recursive

      - name: Initialize Terraform (backend=false, $0 cost)
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

  backend-and-worker-test:
    name: "TV2 & TV3 — Build & Test Spring Boot API and Export Worker (JDK 21)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: TV2 — Compile & Test Backend Core API
        working-directory: backend-core-api
        run: mvn -B -ntp test

      - name: TV3 — Run Standalone Export Worker Security Prototype (5/5 cases)
        working-directory: prototypes/tv3-worker
        run: bash scripts/run-tests.sh

      - name: TV3 — Build & Unit Test Spring Boot Export Worker (16+ cases)
        working-directory: prototypes/tv3-worker
        run: mvn -B -ntp test

  frontend-and-security-qa:
    name: "TV4 — Build React Frontend & Run Automated Security QA Selfcheck (6/6)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: TV4 — Frontend Type-Check & Vite Production Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: TV4 — Run Automated API Security Selfcheck (6 Scenarios) & Secret Scanner
        run: |
          pip install -r tests/security/requirements.txt
          python tests/security/selfcheck.py
          python tests/security/scan_secrets.py frontend tests docs infra
