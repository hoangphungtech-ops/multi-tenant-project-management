server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: backend-core-api
  profiles:
    default: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/backenddb}
    username: ${DB_USERNAME:backend}
    password: ${DB_PASSWORD:local_dev_only}
    hikari:
      pool-name: BackendHikariPool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}

app:
  security:
    demo-mode: ${APP_SECURITY_DEMO_MODE:true}
    audience: ${ENTRA_AUDIENCE:}
  azure:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    queue-name: ${AZURE_QUEUE_NAME:export-jobs}
    blob-container: ${AZURE_BLOB_CONTAINER:exports}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
