services:
  postgres:
    image: postgres:16
    container_name: backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backenddb}
      POSTGRES_USER: ${POSTGRES_USER:-backend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backend} -d ${POSTGRES_DB:-backenddb}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [backend-net]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: backend-azurite
    restart: unless-stopped
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --location /data --debug /data/debug.log
    ports:
      - "10000:10000"
      - "10001:10001"
    volumes:
      - azurite_data:/data
    networks: [backend-net]

volumes:
  postgres_data:
  azurite_data:

networks:
  backend-net:
    driver: bridge
